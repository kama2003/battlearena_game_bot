<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>BATTLE</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load or
      // refresh on a client-side route (e.g. /battlearena_game_bot/home)
      // 404s. This re-encodes that path as a query string and redirects to
      // index.html, which main.tsx's routing then restores. Not needed for
      // the normal Telegram Mini App flow (which always opens the root
      // URL), but keeps the deployed site itself browsable and refreshable.
      // Technique: https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
